<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sweet Blooms</title>
    <link rel="stylesheet" href="wdcss.css">
</head>
<body>

<header>
    <h1>🌸 Sweet Blooms</h1>
    <p>Fresh Flowers, Beautiful Moments</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#flowers">Flowers</a>
    <a href="#order">Order</a>
    <a href="#contact">Contact</a>
</nav>

<section class="hero">
    <h2>Fresh Happiness!!!</h2>
</section>

<!-- ✅ HIDDEN CHECKBOXES -->
<input type="checkbox" id="rose">
<input type="checkbox" id="sunflower">
<input type="checkbox" id="tulip">
<input type="checkbox" id="orchid">
<input type="checkbox" id="lily">
<input type="checkbox" id="hibiscus">
<input type="checkbox" id="lilac">
<input type="checkbox" id="daisy">

<!-- 🌸 FLOWER SELECTION -->
<section class="flowers" id="flowers">
    <h2>Select Flowers</h2>

    <div class="grid">

        <label for="rose">
            <div class="card">
                <img src="rose.png">
                <h3>Rose</h3>
                <p>₹100</p>
            </div>
        </label>

        <label for="sunflower">
            <div class="card">
                <img src="sunflower.png">
                <h3>Sunflower</h3>
                <p>₹120</p>
            </div>
        </label>

        <label for="tulip">
            <div class="card">
                <img src="tulip.png">
                <h3>Tulip</h3>
                <p>₹110</p>
            </div>
        </label>

        <label for="orchid">
            <div class="card">
                <img src="orchid.png">
                <h3>Orchid</h3>
                <p>₹150</p>
            </div>
        </label>

        <label for="lily">
            <div class="card">
                <img src="lily.png">
                <h3>Lily</h3>
                <p>₹130</p>
            </div>
        </label>

        <label for="hibiscus">
            <div class="card">
                <img src="hibiscus.png">
                <h3>Hibiscus</h3>
                <p>₹90</p>
            </div>
        </label>

        <label for="lilac">
            <div class="card">
                <img src="lilac.png">
                <h3>Lilac</h3>
                <p>₹140</p>
            </div>
        </label>

        <label for="daisy">
            <div class="card">
                <img src="daisy.png">
                <h3>Daisy</h3>
                <p>₹80</p>
            </div>
        </label>

    </div>
</section>

<!-- 🌸 BOUQUET PREVIEW -->
<section class="bouquet">
    <h2>Your Flowers 🌸</h2>

    <div class="preview">
        <img class="flower rose" src="rose.png">
        <img class="flower sunflower" src="sunflower.png">
        <img class="flower tulip" src="tulip.png">
        <img class="flower orchid" src="orchid.png">
        <img class="flower lily" src="lily.png">
        <img class="flower hibiscus" src="hibiscus.png">
        <img class="flower lilac" src="lilac.png">
        <img class="flower daisy" src="daisy.png">
    </div>
</section>

<!-- ORDER -->
<section class="order" id="order">
    <h2>Order Your Flowers</h2>
    <form action="wd.html">
        <input type="text" placeholder="Your Name" required>
        <input type="text" placeholder="Address" required>
        <button type="submit">Place Order</button>
    </form>
</section>

<!-- CONTACT -->
<section class="contact" id="contact">
    <h2>Contact Us</h2>
    <p>📍 Pune, India</p>
    <p>📞 +91 9876543210</p>
    <p>📧 sweetblooms@gmail.com</p>
</section>

<footer>
    <p>© 2026 Sweet Blooms | Designed with 🌸</p>
</footer>

</body>
</html>
